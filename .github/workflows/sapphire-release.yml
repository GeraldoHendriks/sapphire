# Builds the Sapphire Linux desktop app (AppImage) and publishes it as a GitHub
# release. Every merge to main whose sapphire.json version has no release yet
# becomes release v<version>; scripts/sapphire/install-linux.sh installs it.
# Pull requests that touch the release machinery build without publishing.
name: Sapphire release

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/sapphire-release.yml
      - scripts/sapphire/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sapphire-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version sapphire.json)"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::notice::Release $tag already exists. Bump the version in sapphire.json to publish a new one."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/setup-ci-deps

      - name: Install Linux desktop build libraries
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Cache Rust builds
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: sapphire-native-${{ runner.os }}-${{ hashFiles('native/*/Cargo.lock') }}
          restore-keys: sapphire-native-${{ runner.os }}-

      # Without GITHUB_REPOSITORY the build bakes in no update feed, so the app's
      # own updater stays off. package.json keeps the upstream version, which
      # electron-updater can't order between Sapphire releases.
      - name: Build AppImage
        if: steps.version.outputs.skip != 'true'
        run: env -u GITHUB_REPOSITORY vp run dist:desktop:linux --verbose

      - name: Name release files
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p out
          appimage="$(ls release/*.AppImage | head -n 1)"
          name="Sapphire-${{ steps.version.outputs.version }}-x86_64.AppImage"
          mv "$appimage" "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256")
          ls -la out

      - name: Upload build
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sapphire-linux-x64
          path: out/
          retention-days: 7

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" out/* \
            --target "$GITHUB_SHA" \
            --title "Sapphire ${{ steps.version.outputs.version }}" \
            --generate-notes
